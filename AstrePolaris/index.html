<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Astre Polaris</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bot-container">

        <!-- BALÃO DE FALA -->
        <div class="fala" id="fala">
            Eai boboca 😼
        </div>


        <!-- ROBÔ -->
        <div class="robo-area">

            <div class="robo">

                <!-- ANTENA ESQUERDA -->
                <div class="antena antena-esquerda">
                    <div class="ponta-antena"></div>
                </div>

                <!-- ANTENA DIREITA -->
                <div class="antena antena-direita">
                    <div class="ponta-antena"></div>
                </div>


                <!-- CABEÇA -->
                <div class="cabeca">

                    <!-- ORELHA ESQUERDA -->
                    <div class="orelha orelha-esquerda"></div>

                    <!-- ORELHA DIREITA -->
                    <div class="orelha orelha-direita"></div>


                    <!-- TELA -->
                    <div class="tela">

                        <div class="cantos canto-1"></div>
                        <div class="cantos canto-2"></div>
                        <div class="cantos canto-3"></div>
                        <div class="cantos canto-4"></div>


                        <!-- OLHO ESQUERDO -->
                        <div class="olho olho-esquerdo">
                            <div class="brilho"></div>
                        </div>


                        <!-- OLHO DIREITO -->
                        <div class="olho olho-direito">
                            <div class="brilho"></div>
                        </div>

                    </div>

                </div>


                <!-- CORPO -->
                <div class="corpo">

                    <!-- BRAÇO ESQUERDO -->
                    <div class="braco braco-esquerdo">
                        <div class="mao mao-esquerda"></div>
                    </div>


                    <!-- PEITO -->
                    <div class="peito">

                        <div class="luz-peito"></div>

                    </div>


                    <!-- BRAÇO DIREITO -->
                    <div class="braco braco-direito">
                        <div class="mao mao-direita"></div>
                    </div>


                    <!-- BARRIGA -->
                    <div class="barriga"></div>

                </div>

            </div>

        </div>


        <!-- CHAT -->
        <div class="chat">

            <input
                type="text"
                id="mensagem"
                placeholder="Fale comigo..."
                autocomplete="off"
            >

            <button id="enviar" type="button">
                ➤
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
