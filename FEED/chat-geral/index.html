<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08070D">
<title>Chat Geral | Casa dos MBTIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 20%,#38204f 0,transparent 42%),radial-gradient(ellipse at 80% 80%,#40213d 0,transparent 40%),#08070d;color:#f7f1ff;font-family:'Baloo 2',sans-serif}.notice{width:min(100%,620px);padding:clamp(28px,6vw,52px);text-align:center;border:1px solid #8e65b866;border-radius:28px;background:#171020eF;box-shadow:0 18px 70px #0008}.lock{width:76px;height:76px;margin:0 auto 20px;display:grid;place-items:center;border-radius:24px;background:#9c72d522;color:#d9baff;font-size:36px}.eyebrow{color:#c7a7ef;font-size:12px;font-weight:800;letter-spacing:2px}.notice h1{margin:10px 0;font-family:Fredoka,sans-serif;font-size:clamp(30px,7vw,44px)}.notice p{max-width:440px;margin:0 auto 24px;color:#c9bfd4;font-size:17px;line-height:1.6}.button{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:14px;background:linear-gradient(110deg,#9d72d5,#d17bb7);color:#160e20;text-decoration:none;font-weight:800}.small{display:block;margin-top:18px;color:#9e91aa;font-size:13px}
</style>
</head>
<body>
<main class="notice">
<div class="lock" aria-hidden="true">🔒</div>
<span class="eyebrow">CASA DOS MBTIs</span>
<h1>Chat Geral</h1>
<p>O Chat Geral está disponível exclusivamente no aplicativo Android da Casa dos MBTIs. Para conversar com a comunidade, acesse o APK.</p>
<a class="button" href="../../">Voltar ao site</a>
<span class="small">O chat não está disponível pela versão web.</span>
</main>
</body>
</html>
